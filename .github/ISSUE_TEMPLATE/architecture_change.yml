name: Architecture Change
description: Propose an architectural change
title: "[ARCHITECTURE] "
labels:

* architecture

body:

* type: textarea
  id: current
  attributes:
  label: Current Architecture
  description: Describe the existing approach
  validations:
  required: true

* type: textarea
  id: proposed
  attributes:
  label: Proposed Change
  validations:
  required: true

* type: textarea
  id: reason
  attributes:
  label: Why is this needed?
  validations:
  required: true

* type: dropdown
  id: impact
  attributes:
  label: Impact Level
  options:
  - Low
  - Medium
  - High
  - Critical
