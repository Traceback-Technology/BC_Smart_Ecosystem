name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels:

* bug
  body:

* type: markdown
  attributes:
  value: |
  Thanks for reporting a bug.

* type: textarea
  id: summary
  attributes:
  label: Bug Summary
  description: Describe the issue
  placeholder: The login page crashes when pressing submit...
  validations:
  required: true

* type: textarea
  id: reproduce
  attributes:
  label: Steps to Reproduce
  placeholder: |
  1. Open app
  2. Click login
  3. Enter credentials
  4. Crash occurs
  validations:
  required: true

* type: textarea
  id: expected
  attributes:
  label: Expected Behavior
  validations:
  required: true

* type: dropdown
  id: module
  attributes:
  label: Module
  options:
  - BC Ways
  - BC Eats
  - Drone System
  - Backend API
  - Authentication
  - Notifications
  - Security
  - Analytics
  validations:
  required: true

* type: input
  id: branch
  attributes:
  label: Branch
  placeholder: develop

* type: textarea
  id: logs
  attributes:
  label: Logs / Screenshots
