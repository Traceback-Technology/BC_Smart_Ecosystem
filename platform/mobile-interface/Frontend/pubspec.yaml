name: fontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  collection: ^1.19.1
  geolocator: ^14.0.2
  google_fonts: ^8.2.1
  image_picker: 1.2.1
  http: ^1.2.2
  flutter_stripe: ^11.5.0
  shared_preferences: ^2.5.5
  fl_chart: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/bc_ways/data/
    - assets/bc_ways/map/
  fonts:
    - family: BCEatsPoppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700