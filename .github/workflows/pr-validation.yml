      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^\[(Feature|Bug|Refactor|Integration|Architecture|Docs)\] ]]; then
            echo "PR title must start with [Feature], [Bug], etc."
            exit 1
          fi

      - name: Ensure issue is linked
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$PR_BODY" != *"Closes #"* ]]; then
            echo "PR must reference an issue using 'Closes #'"
            exit 1
          fi