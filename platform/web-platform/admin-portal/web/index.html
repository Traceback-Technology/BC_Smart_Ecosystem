<!DOCTYPE html>
<html>
<head>
  <script>
    // Handoff from the BC Ways & Eats app: admins arrive as
    //   https://<this-portal>/#token=<backend token>
    // Take the token out of the address bar BEFORE Flutter starts, so it is
    // not left in the URL, the browser history or Flutter's router.
    (function () {
      var match = /^#token=([^&]+)/.exec(window.location.hash || '');
      var token = match ? decodeURIComponent(match[1]) : null;
      if (match) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
      // Read once by lib/main.dart, then forgotten.
      window.bcTakeHandoffToken = function () {
        var t = token;
        token = null;
        return t;
      };
    })();
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

</head>

</body>
</html>
